
services:

  # ==========================================================
  # POSTGRESQL DATABASE
  # ==========================================================
  postgres:
    image: postgres:17
    container_name: drxs69-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: portfolio_dev_password
      POSTGRES_DB: portfolio_db

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - portfolio_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U portfolio -d portfolio_db
      interval: 5s
      timeout: 5s
      retries: 10

  # ==========================================================
  # FASTAPI BACKEND
  # ==========================================================
  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: drxs69-api
    restart: unless-stopped

    environment:
      DATABASE_URL: postgresql+psycopg://portfolio:portfolio_dev_password@postgres:5432/portfolio_db
      WRITE_API_ENABLED: ${WRITE_API_ENABLED:-false}
      PORTFOLIO_ADMIN_TOKEN: ${PORTFOLIO_ADMIN_TOKEN:-}

    ports:
      - "127.0.0.1:8000:8000"

    depends_on:
      postgres:
        condition: service_healthy

volumes:
  portfolio_postgres_data:
