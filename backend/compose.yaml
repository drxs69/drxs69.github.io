
services:
  postgres:
    image: postgres:17
    container_name: drxs69-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: portfolio_dev_password
      POSTGRES_DB: portfolio_db

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - portfolio_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U portfolio -d portfolio_db
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  portfolio_postgres_data:
